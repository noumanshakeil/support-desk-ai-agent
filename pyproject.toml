[project]
name = "support-desk-ai-agent"
version = "2.0.0"
description = "Support desk agent that triages tickets, proposes macros/SLA, drafts replies, and keeps an auditable inbox workflow."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
